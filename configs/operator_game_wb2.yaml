# Stage 11 (감자 10/31 21:42-21:43 KST): a bank of neural operators (SFNO, neuraloperator) on the
# frozen stage 9 model (N1), with RL choosing which operator acts in each latitude band
# (models/operator_control.py). Same game, years and baselines as stage 9 N3
# (configs/physics_game_wb2.yaml); needs neuraloperator and torch-harmonics.
#
#   O-sel:  python scripts/play_game.py --checkpoint runs/physics_n1/checkpoint.pt \
#               --config configs/operator_game_wb2.yaml --data-dir DATA --out runs/stage11_osel
#   O-soft: ... --mode grad --set control.selection=soft --out runs/stage11_osoft
#   O-1:    ... --mode grad --set control.n_operators=1 control.selection=soft --out runs/stage11_o1
#   eval:   python scripts/eval_game.py --checkpoint runs/physics_n1/checkpoint.pt \
#               --config configs/operator_game_wb2.yaml --data-dir DATA O-sel=runs/stage11_osel/controller.pt \
#               --variants no_control random_control no_diag option_0 option_4 nudging nudging_half
data:
  path: "{data_dir}/era5.zarr"
  time_range: ["2017-12-01", "2021-01-15"]
  train: {start: "2018-01-01T06:00", end: "2019-12-31T18:00"}
  val: {start: "2020-01-01", end: "2020-12-31T12:00"}
eval:
  climatology_zarr: "{data_dir}/climatology.zarr"

game:                   # the stage 9 N3 game; hybrid: choices by RL, operators by the exact gradient
  mode: hybrid
  hybrid_lambda: 0.5    # lambda L_RL + (1 - lambda) L_grad
  steps: 100
  batch_size: 1         # x 4 members, all with gradients through the frozen N1
  lr: 1.0e-3
  warmup_steps: 10
  members: 4
  explore: 0.5
  horizon: 6
  mask_kinds: [variables, shell, region]
  mask_rate: 1.0
  region_fraction: 0.25
  obs_prob: 0.5
  nudge: null           # re-observation: null = restart from the observed part (hidden at the mean);
                        # 0.5 = nudging arm (C1nudge / n3nudge: keep the forecast, pull observed points halfway)
  masked_weight: 0.5
  cap: 10.0             # a blown-up episode (non-finite N1 forecast) scores this error from then on and
                        # restarts from its initial state; evaluation counts blow-ups (stage 10 finding)
  log_every: 10

control:
  kind: operator        # models/operator_control.py
  n_operators: 4        # O-1: 1
  selection: choice     # O-soft: soft (softmax mixture, mode grad)
  band_edges: [-30.0, 30.0]  # three selection bands: south, tropics, north
  band_taper: 5.0
  operator_hidden: 16
  operator_layers: 2
  operator_modes: 16
  out_degree: 10        # the control fields are truncated at n = 10
  max_degree: 4         # the policy's view: low harmonics (n <= 4) of the state and the mask
  fields: [temp, zeta, q, phib]
  layers: [[850, 1000], [500, 700], [200, 400], [50, 150]]
  hidden: 64
  action_scale: 0.2     # one action unit = 0.2 std of the field's 6 h change in that layer
  use_state: true       # false: open loop
  control_cost: 1.0e-4  # 1/2 |a|^2 per step in the training reward (0: the no-cost ablation)
