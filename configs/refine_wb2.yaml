# Reinforcing the WB2 64x32 world model (trained on 2015-2017) with new years.
#   new data: 2018-2019 (never seen in training)   held-out test: 2020
# data_dir holds era5.zarr (2017-12 .. 2021-01), climatology.zarr and
# graphcast.zarr (GraphCast 2020 forecasts):
#   python scripts/download_weatherbench2.py --out DATA --start 2017-12-01 --end 2021-01-15 --skip graphcast
#   python scripts/download_weatherbench2.py --out DATA --skip era5 clim --forecast-year 2020 \
#       --forecast-lead-steps 20 --forecast-init-stride 4
data:
  path: "{data_dir}/era5.zarr"
  time_range: ["2017-12-01", "2021-01-15"]
  train: {start: "2018-01-01T06:00", end: "2019-12-31T18:00"}
  val: {start: "2020-01-01", end: "2020-12-31T12:00"}
eval:
  climatology_zarr: "{data_dir}/climatology.zarr"

refine:
  mode: rl              # rl | supervised (same data and steps, no reward term)
  steps: 150
  batch_size: 2
  lr: 1.0e-4
  warmup_steps: 10
  members: 4            # GRPO group size
  horizon: 4            # 24 h rollouts, also the anchor's rollout length
  gamma: 1.0
  beta: 1.0
  rl_weight: 1.0
  anchor_weight: 1.0
  log_every: 10
