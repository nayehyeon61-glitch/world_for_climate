# Scaling check (cause analysis, 10/31): is the gap a capacity problem?
# S = wb2_64x32.yaml with independent shells (0.74M parameters, 2100 steps of batch 2 = ~1 epoch of 2015-17).
# This arm: length x2: S width, twice the steps of every stage (the training-length control).
# Train: python scripts/train.py --config configs/wb2_scale_l2.yaml --data-dir DATA
# Causes: python scripts/eval_causes.py --checkpoint runs/wb2_scale_l2/checkpoint.pt --data-dir DATA --inits 31 --lead-steps 12 --variants no_denoiser

experiment: wb2_64x32_scale_l2
output_dir: runs/wb2_scale_l2
data:
  source: zarr
  path: '{data_dir}/era5.zarr'
  time_range: ['2015-01-01', '2019-01-15']
  load_into_memory: true
  train: {start: '2015-01-01T06:00', end: '2017-12-31T18:00'}
  val: {start: '2018-01-01', end: '2018-12-31T12:00'}
  stats_samples: 256
task:
  name: graphcast_13
  pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
shells: null
model:
  transition: lie_diffusion
  history: 2
  mesh: {mesh_splits: 3, latent_splits: 3, patch_splits: 1, break_symmetry: true}
  gnn: {hidden_dim: 64, vector_dim: 16, latent_scalars: 32, latent_vectors: 8, hidden_layers: 1,
    encoder_layers: 2, latent_layers: 1, decoder_layers: 2}
  lie: {layers: 2, shell_coupling: independent}
  diffusion: {layers: 3, cond_dim: 64, num_steps_denoising: 3}
  residual_layers: 2
train:
  batch_size: 2
  num_workers: 0
  log_every: 25
  stages:
  - name: repr
    steps: 1200
    lr: 0.001
    warmup_steps: 50
    weights: {rec: 1.0}
  - name: dynamics
    steps: 2000
    lr: 0.0005
    warmup_steps: 50
    rollout_steps: 2
    weights: {forecast: 1.0, latent: 0.1, rec: 0.5, geo: 0.001, joint: 0.001}
  - name: stochastic
    steps: 1000
    lr: 0.0003
    warmup_steps: 50
    rollout_steps: 1
    weights: {gen: 1.0}
  engine: {save_every: 50}
eval:
  lead_steps: 20
  members: 4
  batch_size: 1
  init_hours: [0, 12]
  climatology_zarr: '{data_dir}/climatology.zarr'
