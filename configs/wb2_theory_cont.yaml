# Control for configs/wb2_theory_lie.yaml (arm A', "Cont-Mono"): the same
# programmer and MDL selection, but a continuous so(3) element per step instead of
# a codebook entry. Differences to the VQ arm isolate the effect of a discrete,
# shared vocabulary.
#
#   python scripts/train.py --config configs/wb2_theory_cont.yaml --data-dir DATA \
#       --init-from runs/wb2_64x32/checkpoint.pt
experiment: wb2_64x32_theory_continuous
output_dir: runs/wb2_theory_cont

data:
  source: zarr
  path: "{data_dir}/era5.zarr"
  time_range: ["2015-01-01", "2019-01-15"]
  load_into_memory: true
  train: {start: "2015-01-01T06:00", end: "2017-12-31T18:00"}
  val: {start: "2018-01-01", end: "2018-12-31T12:00"}
  stats_samples: 256

task:
  name: graphcast_13
  pressure_levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]

shells: null

model:
  transition: lie_program
  history: 2
  mesh: {mesh_splits: 3, latent_splits: 3, patch_splits: 1, break_symmetry: true}
  gnn: {hidden_dim: 64, vector_dim: 16, latent_scalars: 32, latent_vectors: 8,
        hidden_layers: 1, encoder_layers: 2, latent_layers: 1, decoder_layers: 2}
  lie: {layers: 2, shell_coupling: chain}
  theory: {codebook_size: 0, max_steps: 3, lambda_mdl: 1.0}

train:
  batch_size: 2
  num_workers: 0
  log_every: 25
  stages:
    - {name: theory, steps: 1500, lr: 5.0e-4, warmup_steps: 50,
       weights: {rec: 1.0, latent: 1.0}}

eval:
  lead_steps: 2
  members: 1
  batch_size: 1
  init_hours: [0, 12]
  climatology_zarr: "{data_dir}/climatology.zarr"
