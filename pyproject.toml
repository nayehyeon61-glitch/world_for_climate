[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-wm"
version = "0.1.0"
description = "Geometric stochastic climate world model: Shell-GNN with Lie-structured latent dynamics and a DIAMOND-style latent diffusion transition, with GraphCast-aligned I/O and evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "xarray>=2023.1",
    "pyyaml>=6.0",
    "torch>=2.1",
    "torch_geometric>=2.4",
]

[project.optional-dependencies]
io = ["dask", "netCDF4", "zarr"]
dev = ["pytest>=7"]
# stage 11 (models/operator_control.py): SFNO operators. torch-harmonics 0.9 pins torch < 2.15;
# 0.7.4 is pure Python for the spherical harmonic transforms and works with newer torch
operator = ["neuraloperator>=2.0", "torch-harmonics>=0.7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning"]
